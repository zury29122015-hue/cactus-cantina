<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cactus Cantina — Cazador de Bandoleros</title>
<style>
  html,body{margin:0;padding:0;background:#1a0a14;color:#f6e2c0;font-family:ui-sans-serif,system-ui,sans-serif;overscroll-behavior:none}
  #wrap{display:flex;flex-direction:column;align-items:center;padding:18px;gap:10px}
  canvas{display:block;background:#000;border:3px solid #d97742;box-shadow:0 0 40px #d9774255,0 0 10px #000 inset;border-radius:6px;max-width:100vw;height:auto}
  h1{margin:2px 0 0;letter-spacing:4px;color:#ffce6b;text-shadow:3px 3px 0 #b13a1a,6px 6px 0 #4a1a10;font-size:26px}
  .hud{font-size:13px;color:#caa57e;max-width:960px;text-align:center;line-height:1.6}
  kbd{background:#3a1c12;padding:2px 7px;border-radius:4px;border:1px solid #ffce6b66;color:#ffce6b;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .pink{color:#ff6fb3}
  .credit{color:#6b4a36;font-size:11px}

  /* Touch controls */
  #tc-toggle{position:fixed;top:8px;right:8px;z-index:200;background:#3a1c12;color:#ffce6b;border:1px solid #ffce6b66;border-radius:6px;padding:5px 9px;font-size:16px;cursor:pointer;font-family:inherit}
  #tc-toggle.on{background:#d97742;color:#1a0a08}
  #touch-controls{display:none;position:fixed;left:0;right:0;bottom:0;top:0;pointer-events:none;z-index:100;-webkit-user-select:none;user-select:none}
  .tc-cluster{position:absolute;bottom:14px;display:grid;gap:12px;pointer-events:auto;touch-action:none}
  .tc-left{left:14px;grid-template-columns:1fr 1fr}
  .tc-right{right:14px;grid-template-columns:1fr 1fr}
  .tc-btn{width:64px;height:64px;border-radius:50%;border:2px solid #ffce6b88;background:rgba(58,28,18,.75);color:#ffce6b;font:bold 20px ui-sans-serif,system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.55);-webkit-tap-highlight-color:transparent;touch-action:none;cursor:pointer;padding:0;line-height:1}
  .tc-btn .lbl{font-size:9px;font-weight:700;letter-spacing:.5px;opacity:.9;margin-top:2px}
  .tc-btn.on{background:rgba(217,119,66,.95);transform:scale(.92);border-color:#ffce6b}
  .tc-btn.shoot{background:rgba(200,50,58,.8);border-color:#ff8fbf;width:76px;height:76px;font-size:24px}
  .tc-btn.parry{background:rgba(255,111,179,.55)}
  .tc-btn.super{background:rgba(255,206,107,.55);color:#1a0a08}
  .tc-btn.jump{background:rgba(58,88,168,.8);color:#fff}
  .tc-btn.enter{background:rgba(40,100,40,.75);color:#cfe0e8}
  .tc-btn.dash{background:rgba(120,90,40,.8)}
  @media (pointer: coarse){
    #touch-controls{display:block}
    canvas{max-height:calc(100vh - 24px)}
    #wrap{padding:4px;gap:2px}
    h1{font-size:16px}
    .hud,.credit{display:none}
  }
  body.tc-force #touch-controls{display:block}
</style>
</head>

<div id="wrap">
  <h1>CAZADOR DE BANDOLEROS</h1>
  <canvas id="game" width="960" height="540"></canvas>
  <div class="hud">
    <kbd>A</kbd> <kbd>D</kbd> mover · <kbd>W</kbd>/<kbd>Espacio</kbd> saltar · <kbd>Shift</kbd> dash · <kbd>J</kbd> / click disparar ·
    <kbd>K</kbd> parry <span class="pink">(rosas)</span> · <kbd>L</kbd> SUPER <span class="pink">(3 parries → ½ vida)</span>
    &nbsp;·&nbsp; En el mapa: <kbd>Enter</kbd> pelear · <kbd>Esc</kbd> menú · <kbd>R</kbd> reiniciar partida

</div>

const lerp=(a,b,t)=>a+(b-a)*t;
function circleHitsRect(cx,cy,r,rx,ry,rw,rh){const nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh),dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r}
function distPtSeg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L2=dx*dx+dy*dy;let t=((px-x1)*dx+(py-y1)*dy)/(L2||1);t=clamp(t,0,1);const x=x1+t*dx,y=y1+t*dy;return Math.hypot(px-x,py-y)}

let AC=null,master=null,musicGain=null;
function initAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.35;master.connect(AC.destination);musicGain=AC.createGain();musicGain.gain.value=.55;musicGain.connect(master);startMusic()}
addEventListener('keydown',initAudio,{once:true});

function sfx(f,d=.08,t='square',v=.25,s=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=t;const tt=AC.currentTime;o.frequency.setValueAtTime(f,tt);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+s),tt+d);g.gain.setValueAtTime(v,tt);g.gain.exponentialRampToValueAtTime(.0008,tt+d);o.connect(g);g.connect(master);o.start(tt);o.stop(tt+d+.02)}
function noise(d=.1,v=.2){if(!AC)return;const N=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,N,AC.sampleRate),dd=b.getChannelData(0);for(let i=0;i<N;i++)dd[i]=(Math.random()*2-1)*(1-i/N);const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=v;s.connect(g);g.connect(master);s.start()}
function startMusic(){
  const bpm=138,beat=60/bpm;
  const roots=[110,87.31,130.81,98];
  const arps=[[220,261.6,329.6,261.6],[174.6,220,261.6,220],[261.6,329.6,392,329.6],[196,246.9,293.7,246.9]];
  let next=AC.currentTime+.2;
  function tone(f,t,d,T='triangle',v=.09){const o=AC.createOscillator(),g=AC.createGain();o.type=T;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d*.95);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d)}
  function loop(){let t=next;for(let bar=0;bar<roots.length;bar++){const r=roots[bar];tone(r,t,beat*.9,'sawtooth',.07);tone(r*1.5,t+beat,beat*.8,'sawtooth',.05);tone(r,t+2*beat,beat*.9,'sawtooth',.07);tone(r*1.5,t+3*beat,beat*.8,'sawtooth',.05);const a=arps[bar];for(let i=0;i<8;i++)tone(a[i%a.length],t+i*(beat/2),beat*.45,'triangle',.06);t+=4*beat}next=t;setTimeout(loop,(4*roots.length*beat-.2)*1000)}
  loop();
}

function buildConfigs(){
  return BOSS_DATA.map((d,i)=>{
    const id=i+1;
    const biome=id<=8?0:id<=16?1:id<=24?2:id<=32?3:id<=40?4:5;
    const isFinal=(id===50);
    const [name,bodyType,palIdx,accessory,hp,size,attackMix,aggression]=d;
    const palette=PAL[biome][palIdx]||PAL[biome][0];
    // Super damage ratio: linearly decays from .50 (boss 1) to .12 (boss 50)
    const superRatio=lerp(0.50,0.12,(id-1)/49);
    return {id,name,biome,bodyType,palette,attackMix,hp,size,isFinal,accessory,aggression,superRatio};
  });
}

const FINAL_ID=CFGS[CFGS.length-1].id;

/* ===== LOAD BOSS ===== */
function loadBoss(id){
  const c=CFGS.find(c=>c.id===id);
  boss.config=c;boss.name=c.name;boss.bodyType=c.bodyType;boss.biome=c.biome;boss.palette=c.palette;
  boss.isFinal=c.isFinal;boss.hp=c.hp;boss.maxHp=c.hp;
  boss.w=140*c.size;boss.h=200*c.size;
  boss.x=W-boss.w-60;boss.y=240;boss.baseY=240;
  boss.state='intro';boss.stateTime=80;boss.sub=0;
  boss.invuln=60;boss.hitFlash=0;boss.alive=true;boss.bob=0;boss.phase=1;
  boss.heartX=boss.x+boss.w/2;boss.heartY=boss.y+80;
  boss.parryTimer=90; // first parry orb appears ~1.5s into fight
}

  player.x=180;player.y=380;player.vx=0;player.vy=0;
  player.hp=player.maxHp;player.iframes=80;
  player.parryPoints=0;player.superReadyPulse=0;
  player.dashCd=0;player.dashTime=0;player.shootCd=0;
  player.alive=true;player.facing=1;player.onGround=false;
  bullets.length=0;ebullets.length=0;particles.length=0;sparks.length=0;
  flash=0;slowmo=0;shakeT=0;shakeMag=0;
  state='fight';
}

/* ===== PARTICLES ===== */
function emit(x,y,c,n=8,sp=4,life=30,r=3,g=.25){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-sp,sp),vy:rand(-sp,1),life:life+rand(-6,6),maxLife:life,c,r:r+rand(-1,1),g})}
function emitSpark(x,y,c='#fff',n=6){for(let i=0;i<n;i++)sparks.push({x,y,vx:rand(-6,6),vy:rand(-6,6),life:12+rand(-4,4),c})}

/* ===== PLAYER ACTIONS ===== */
function hurtPlayer(){
  if(!player.alive||player.iframes>0||player.dashTime>0)return false;
  player.hp--;player.iframes=80;shake(18,7);flash=12;noise(.18,.18);sfx(180,.18,'square',.18,-120);
  emit(player.x+player.w/2,player.y+player.h/2,'#ff5050',18,5,40,3,.18);
  if(player.hp<=0){player.alive=false;state='lose';cinematicT=120;shake(40,12)}
  return true;
}
function doParry(b,idx){
  ebullets.splice(idx,1);
  player.vy=-11;player.parryAnim=22;
  player.parryPoints=Math.min(player.maxParry,player.parryPoints+1);
  if(player.parryPoints>=player.maxParry)player.superReadyPulse=90;
  slowmo=14;shake(10,5);sfx(880,.07,'triangle',.32,600);sfx(1320,.10,'triangle',.22,400);
  emitSpark(b.x,b.y,'#ff6fb3',22);emit(b.x,b.y,'#ff6fb3',18,6,32,4,.1);
}
function tryParry(){
  if(player.onGround)return false;
  const pcx=player.x+player.w/2,pcy=player.y+player.h/2;
  let best=-1,bd=Infinity;
  for(let i=0;i<ebullets.length;i++){const b=ebullets[i];if(!b.parryable)continue;const dx=b.x-pcx,dy=b.y-pcy,d2=dx*dx+dy*dy,r=b.r+70;if(d2<r*r&&d2<bd){bd=d2;best=i}}
  if(best<0)return false;doParry(ebullets[best],best);return true;
}
function autoParry(){
  if(player.onGround)return;
  for(let i=ebullets.length-1;i>=0;i--){const b=ebullets[i];if(!b.parryable)continue;if(circleHitsRect(b.x,b.y,b.r+6,player.x-2,player.y-2,player.w+4,player.h+4)){doParry(b,i);return}}
}
function tryShoot(){
  if(player.shootCd>0)return;player.shootCd=7;
  const px=player.x+player.w/2+player.facing*16,py=player.y+18+(player.runFrame%2===0?-1:0);
  bullets.push({x:px,y:py,vx:player.facing*11,vy:0,life:60,big:false});
  sfx(880,.05,'square',.13,-300);emitSpark(px,py,'#ffce6b',3);
}
function trySuper(){
  if(player.parryPoints<player.maxParry)return;
  player.parryPoints=0;player.superReadyPulse=0;
  boss.invuln=0;
  const ratio=(boss.config&&boss.config.superRatio)||0.50;
  hurtBoss(Math.ceil(boss.maxHp*ratio));
  if(boss.alive)boss.invuln=Math.max(boss.invuln,30);
  sfx(110,.4,'sawtooth',.35,600);sfx(220,.3,'square',.25,800);noise(.4,.25);
  flash=32;shake(40,12);slowmo=28;
  for(let i=0;i<60;i++){const a=Math.random()*Math.PI*2,sp=rand(2,9);particles.push({x:player.x+player.w/2+Math.cos(a)*8,y:player.y+20+Math.sin(a)*8,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:50,maxLife:50,c:i%2===0?'#ff6fb3':'#ffce6b',r:4,g:.1})}
  const bcx=boss.phase===3?boss.heartX:boss.x+boss.w/2,bcy=boss.phase===3?boss.heartY:boss.y+boss.h/2;
  emit(bcx,bcy,'#ff6fb3',50,9,60,6,.15);
}

/* ===== BOSS LOGIC ===== */
function setBoss(s,t){boss.state=s;boss.stateTime=t;boss.sub=0;boss._fired=false}
function pickAttack(){
  if(boss.isFinal){
    const all=boss.attackMix||boss.config.attackMix;
    let pool=all.slice(0,3);
    if(boss.phase>=2)pool=all.slice(0,5);
    if(boss.phase>=3)pool=all.slice();
    const a=pool[Math.floor(Math.random()*pool.length)];
    setBoss(a,ATK_DUR[a]||110);
  } else {
    const mix=boss.config.attackMix;
    const a=mix[Math.floor(Math.random()*mix.length)];
    setBoss(a,ATK_DUR[a]||110);
  }
}

function hurtBoss(dmg){
  if(boss.invuln>0||!boss.alive)return;
  boss.hp-=dmg;boss.hitFlash=5;
  emitSpark(boss.x+boss.w/2+rand(-30,30),boss.y+rand(20,boss.h-30),'#ffce6b',3);
  if(boss.isFinal){
    while(true){
      if(boss.phase===1&&boss.hp<=boss.maxHp*.66){boss.phase=2;setBoss('transform',90);boss.invuln=100;flash=18;shake(24,8)}
      else if(boss.phase===2&&boss.hp<=boss.maxHp*.33){boss.phase=3;setBoss('transform',90);boss.invuln=110;flash=22;shake(30,10)}
      else break;
    }
  }
  if(boss.hp<=0){boss.alive=false;boss.hp=0;setBoss('death',180);shake(60,14);flash=30}
}

/* ===== SPAWNERS ===== */
function spawnSpine(x,y,vx,vy){ebullets.push({x,y,vx,vy,r:7,life:160,parryable:false,type:'spine',gravity:.22})}
function spawnTumble(x,y,dir){ebullets.push({x,y,vx:dir*5.2,vy:0,life:260,parryable:true,type:'tumble',r:18,ang:0})}
function spawnShock(x,dir){ebullets.push({x,y:GROUND-12,vx:dir*7,vy:0,r:18,life:140,parryable:false,type:'shock'})}
function spawnNote(x,y,vx,vy,pink){ebullets.push({x,y,vx,vy,r:10,life:200,parryable:!!pink,type:'note',age:0})}
function spawnWave(x,y,vx,ph){ebullets.push({x,y,vx,vy:0,r:12,life:240,parryable:false,type:'wave',age:0,phase:ph,baseY:y})}
function spawnPetal(cx,cy,a,sp,pink){ebullets.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:11,life:200,parryable:!!pink,type:'petal',ang:a})}
function spawnSeed(x,y,vx,vy){ebullets.push({x,y,vx,vy,r:9,life:240,parryable:false,type:'seed',gravity:.32,willPink:true})}
function spawnBarrage(x,y,vx,vy,pink){ebullets.push({x,y,vx,vy,r:8,life:140,parryable:!!pink,type:'bar'})}
function spawnLaser(x,y,ang){ebullets.push({x,y,type:'laser',life:95,age:0,telegraph:40,angle:ang,length:1200,r:18,parryable:false})}
function spawnBomb(x,y,vx,vy){ebullets.push({x,y,vx,vy,r:10,life:200,parryable:false,type:'bomb',gravity:.32})}
function spawnDive(){
  const sx=clamp(player.x+player.w/2+rand(-40,40),60,W-60);
  ebullets.push({x:sx,y:-40,vx:0,vy:14,r:22,life:120,parryable:false,type:'dive'});
}
/* Pink parry orb — every boss emits these on a timer so the parry meter is always reachable */
function spawnOrb(){
  const sx=boss.x+20+Math.random()*40;
  const sy=boss.y+40;
  const baseY=240+Math.random()*80;
  const vx=-2.4-Math.random()*1.2;
  ebullets.push({x:sx,y:sy,vx,vy:0,r:13,life:300,parryable:true,type:'orb',age:0,baseY});
}

/* ===== BOSS UPDATE ===== */
function updateBoss(){
  boss.bob+=.05;
  if(boss.invuln>0)boss.invuln--;
  if(boss.hitFlash>0)boss.hitFlash--;
  // Parry-orb tick — guaranteed parryable projectile, faster on aggressive bosses
  if(boss.state!=='intro'&&boss.state!=='death'&&boss.state!=='transform'){
    boss.parryTimer--;
    if(boss.parryTimer<=0){
      spawnOrb();
      const agg=(boss.config&&boss.config.aggression)||1;
      boss.parryTimer=Math.floor(240-(agg-1)*120+Math.random()*30);
    }
  }
  const tgtY=(boss.isFinal&&boss.phase===3)?180:boss.baseY;
  boss.y=lerp(boss.y,tgtY+Math.sin(boss.bob)*8,.06);
  boss.stateTime--;
  const bcx=boss.x+boss.w/2,bcy=boss.y+boss.h/2;
  const px=player.x+player.w/2,py=player.y+player.h/2;

  switch(boss.state){
    case 'intro':
      if(boss.stateTime<=0)setBoss('idle',40);
      break;
    case 'idle':
      if(boss.stateTime<=0)pickAttack();
      break;
    case 'transform':
      if(boss.stateTime%4===0)emit(boss.x+boss.w/2+rand(-50,50),boss.y+rand(0,boss.h),'#ffce6b',6,5,30,4,.05);
      if(boss.stateTime<=0){if(boss.phase===3){boss.heartX=boss.x+boss.w/2;boss.heartY=boss.y+80}setBoss('idle',30)}
      break;
    case 'death':
      if(boss.stateTime%4===0){emit(boss.x+rand(0,boss.w),boss.y+rand(0,boss.h),'#ffce6b',6,6,50,5,.12);sfx(rand(200,500),.08,'square',.18,-200)}
      if(boss.stateTime<=0)onBossDefeated();
      break;

    case 'spines':
      if(boss.stateTime===80)sfx(160,.1,'sawtooth',.18,-60);
      if(boss.stateTime===60||boss.stateTime===45||boss.stateTime===30){
        const sx=bcx,sy=boss.y+80,dx=px-sx,dy=py-sy,d=Math.max(120,Math.hypot(dx,dy)),t=clamp(d/9,25,60);
        spawnSpine(sx,sy,dx/t,(dy-.5*.22*t*t)/t);
        sfx(520,.07,'square',.16,-200);
      }
      if(boss.stateTime<=0)setBoss('idle',40);
      break;
    case 'tumbleweed':
      if(boss.stateTime===90||boss.stateTime===65||boss.stateTime===40){spawnTumble(boss.x+20,GROUND-18,-1);sfx(300,.08,'sawtooth',.14,-120)}
      if(boss.stateTime<=0)setBoss('idle',50);
      break;
    case 'stomp':
      if(boss.stateTime>60)boss.baseY=lerp(boss.baseY,180,.15);
      else if(boss.stateTime>40){boss.baseY=lerp(boss.baseY,290,.35);if(boss.stateTime===41){shake(20,8);noise(.25,.2);spawnShock(bcx,-1);spawnShock(bcx,1);emit(bcx,GROUND-4,'#caa57e',24,6,38,4,.15)}}
      else boss.baseY=lerp(boss.baseY,240,.1);
      if(boss.stateTime<=0){boss.baseY=240;setBoss('idle',30)}
      break;
    case 'strum':
      if(boss.stateTime===110){sfx(330,.12,'triangle',.22,200);sfx(440,.12,'triangle',.18,200)}
      if(boss.stateTime===100||boss.stateTime===80||boss.stateTime===60){spawnWave(boss.x+10,260+rand(-40,40),-4.5,Math.random()*Math.PI*2);spawnWave(boss.x+10,200+rand(-40,40),-4.5,Math.random()*Math.PI*2)}
      if(boss.stateTime===50)spawnNote(boss.x+30,boss.y+90,(px-(boss.x+30))/55,-3,true);
      if(boss.stateTime<=0)setBoss('idle',30);
      break;
    case 'notes':
      if(boss.stateTime===100||boss.stateTime===75||boss.stateTime===50||boss.stateTime===25){
        const sx=boss.x+30,sy=boss.y+90,t=55,vx=(px-sx)/t,vy=(py-10-sy-.5*.25*t*t)/t;
        const pink=(boss.stateTime===75||boss.stateTime===25);
        spawnNote(sx,sy,vx,vy,pink);
        sfx(660,.06,'square',.16,300);
      }
      if(boss.stateTime<=0)setBoss('idle',30);
      break;
    case 'slam':
      if(boss.stateTime>70)boss.baseY=lerp(boss.baseY,150,.18);
      else if(boss.stateTime>50){boss.baseY=lerp(boss.baseY,290,.4);if(boss.stateTime===51){shake(26,10);noise(.3,.22);spawnShock(bcx-30,-1);spawnShock(bcx+30,1);spawnShock(bcx,-1);emit(bcx,GROUND-4,'#caa57e',30,7,42,5,.18)}}
      else boss.baseY=lerp(boss.baseY,240,.1);
      if(boss.stateTime<=0){boss.baseY=240;setBoss('idle',30)}
      break;
    case 'petals':
      if(boss.stateTime===120)sfx(220,.15,'triangle',.2,400);
      if(boss.stateTime===110||boss.stateTime===80||boss.stateTime===50){
        const cx=boss.isFinal?boss.heartX:bcx,cy=boss.isFinal?boss.heartY:bcy;
        const off=Math.random()*Math.PI*2;
        for(let i=0;i<10;i++){const a=off+i*(Math.PI*2/10);spawnPetal(cx,cy,a,3.5,i%4===0)}
      }
      if(boss.stateTime<=0)setBoss('idle',30);
      break;
    case 'heartdash':
      if(boss.stateTime>60){if(boss.isFinal){boss.heartY=lerp(boss.heartY,clamp(player.y-10,120,360),.06);boss.heartX=lerp(boss.heartX,boss.heartX+(player.x<boss.heartX?4:-4),.5)}if(boss.stateTime%6===0)emitSpark(boss.isFinal?boss.heartX:bcx,boss.isFinal?boss.heartY:bcy,'#ff5a3c',4)}
      else if(boss.stateTime===60){boss._dashDir=Math.sign((player.x+player.w/2)-(boss.isFinal?boss.heartX:bcx))||1;boss._dashVX=boss._dashDir*18;sfx(120,.2,'sawtooth',.25,-80);shake(8,4)}
      else if(boss.stateTime>20){if(boss.isFinal){boss.heartX+=boss._dashVX;emit(boss.heartX,boss.heartY,'#ff6fb3',2,1,22,4,.05)}else{boss.x+=boss._dashVX;emit(bcx,bcy,'#ff6fb3',2,1,22,4,.05)}}
      if(boss.stateTime<=0)setBoss('idle',30);
      break;
    case 'seeds':
      if(boss.stateTime===100||boss.stateTime===75||boss.stateTime===50){
        const sx=boss.isFinal?boss.heartX:bcx,sy=boss.isFinal?boss.heartY:bcy;
        for(let i=0;i<3;i++)spawnSeed(sx+rand(-20,20),sy,rand(-5,5),-10);
        sfx(440,.06,'square',.15,-100);
      }
      if(boss.stateTime<=0)setBoss('idle',30);
      break;
    case 'barrage':
      if(boss.stateTime===90||boss.stateTime===75||boss.stateTime===60||boss.stateTime===45||boss.stateTime===30){
        const agg=(boss.config&&boss.config.aggression)||1;
        const sx=boss.x+20,sy=boss.y+90,dx=px-sx,dy=py-sy,d=Math.max(60,Math.hypot(dx,dy));
        const pink=(boss.stateTime===60);
        const v=6+agg*1.5;
        const ang=Math.atan2(dy,dx);
        spawnBarrage(sx,sy,Math.cos(ang)*v,Math.sin(ang)*v,pink);
        // Late-game bosses fire spread fans
        if(agg>1.3)spawnBarrage(sx,sy,Math.cos(ang+.18)*v,Math.sin(ang+.18)*v,false);
        if(agg>1.45)spawnBarrage(sx,sy,Math.cos(ang-.18)*v,Math.sin(ang-.18)*v,false);
        if(agg>1.6)spawnBarrage(sx,sy,Math.cos(ang+.36)*v,Math.sin(ang+.36)*v,false);
        sfx(720,.04,'square',.12,-200);
      }
      if(boss.stateTime<=0)setBoss('idle',30);
      break;
    case 'laser':
      if(boss.stateTime===110){sfx(180,.3,'sawtooth',.25,300);const sx=boss.x+20,sy=boss.y+90,ang=Math.atan2(py-sy,px-sx);spawnLaser(sx,sy,ang)}
      if(boss.stateTime<=0)setBoss('idle',40);
      break;
    case 'bombs':
      if(boss.stateTime===90||boss.stateTime===65||boss.stateTime===40){
        const sx=boss.x+30,sy=boss.y+90,t=50,vx=(px-sx)/t,vy=(GROUND-30-sy-.5*.32*t*t)/t;
        spawnBomb(sx,sy,vx+rand(-1,1),vy);
        sfx(220,.06,'sawtooth',.18,-100);
      }
      if(boss.stateTime<=0)setBoss('idle',30);
      break;
    case 'divebomb':
      if(boss.stateTime>80){boss.baseY=lerp(boss.baseY,-200,.18)}
      else if(boss.stateTime===80){spawnDive();sfx(180,.2,'sawtooth',.2,400)}
      else if(boss.stateTime>30){boss.baseY=lerp(boss.baseY,-200,.1)}
      else {boss.baseY=lerp(boss.baseY,240,.18)}
      if(boss.stateTime<=0){boss.baseY=240;setBoss('idle',30)}
      break;
  }
  if(boss.isFinal&&boss.phase===3&&boss.state!=='death'&&boss.state!=='heartdash'){
    boss.heartX=lerp(boss.heartX,boss.x+boss.w/2+Math.sin(boss.bob*.7)*40,.04);
    boss.heartY=lerp(boss.heartY,boss.y+60+Math.cos(boss.bob*1.1)*16,.05);
  }
}

/* ===== BULLETS UPDATE ===== */
function updateBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.x<-20||b.x>W+20||b.life<=0){bullets.splice(i,1);continue}
    if(boss.alive&&boss.state!=='intro'){
      if(boss.isFinal&&boss.phase===3){
        const dx=b.x-boss.heartX,dy=b.y-boss.heartY;
        if(dx*dx+dy*dy<34*34){hurtBoss(b.big?6:2);bullets.splice(i,1);emitSpark(b.x,b.y,'#ff6fb3',5);continue}
      } else {
        const bx=boss.x+20,by=boss.y+10,bw=boss.w-40,bh=boss.h-20;
        if(b.x>bx&&b.x<bx+bw&&b.y>by&&b.y<by+bh){hurtBoss(b.big?6:2);bullets.splice(i,1);emitSpark(b.x,b.y,'#ffce6b',4);continue}
      }
    }
  }
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];b.life--;b.age=(b.age||0)+1;
    if(b.type==='spine'){b.vy+=b.gravity;b.x+=b.vx;b.y+=b.vy;if(b.y>GROUND-6){ebullets.splice(i,1);emit(b.x,GROUND-6,'#3a2618',6,3,18,2,.2);continue}}
    else if(b.type==='tumble'){b.x+=b.vx;b.ang+=b.vx*.08;b.y=GROUND-18;if(b.x<-40){ebullets.splice(i,1);continue}}
    else if(b.type==='shock'){b.x+=b.vx;b.y=GROUND-14;if(b.x<-40||b.x>W+40){ebullets.splice(i,1);continue}}
    else if(b.type==='wave'){b.x+=b.vx;b.y=b.baseY+Math.sin(b.age*.18+b.phase)*60;if(b.x<-40){ebullets.splice(i,1);continue}}
    else if(b.type==='note'){b.vy+=.25;b.x+=b.vx;b.y+=b.vy;if(b.y>GROUND-6||b.x<-40||b.x>W+40){ebullets.splice(i,1);continue}}
    else if(b.type==='petal'){b.x+=b.vx;b.y+=b.vy;if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){ebullets.splice(i,1);continue}}
    else if(b.type==='seed'){b.vy+=b.gravity;b.x+=b.vx;b.y+=b.vy;if(b.willPink&&b.vy>0&&!b.parryable){b.parryable=true;b.type='seedpink'}if(b.y>GROUND-6||b.x<-40||b.x>W+40){ebullets.splice(i,1);continue}}
    else if(b.type==='seedpink'){b.vy+=.32;b.x+=b.vx;b.y+=b.vy;if(b.y>GROUND-6||b.x<-40||b.x>W+40){ebullets.splice(i,1);continue}}
    else if(b.type==='bar'){b.x+=b.vx;b.y+=b.vy;if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){ebullets.splice(i,1);continue}}
    else if(b.type==='bomb'){b.vy+=b.gravity;b.x+=b.vx;b.y+=b.vy;if(b.y>=GROUND-6){const cx=b.x;ebullets.splice(i,1);spawnShock(cx,-1);spawnShock(cx,1);emit(cx,GROUND-4,'#ff6fb3',16,6,30,4,.15);shake(8,4);noise(.15,.18);continue}if(b.x<-40||b.x>W+40){ebullets.splice(i,1);continue}}
    else if(b.type==='dive'){b.y+=b.vy;b.x+=Math.sin(b.age*.2)*1.5;if(b.y>GROUND-6){const cx=b.x;ebullets.splice(i,1);spawnShock(cx,-1);spawnShock(cx,1);emit(cx,GROUND-4,'#caa57e',20,7,36,5,.18);shake(14,8);noise(.2,.22);continue}}
    else if(b.type==='orb'){b.x+=b.vx;if(b.age<30)b.y=lerp(b.y,b.baseY,.08);else b.y=b.baseY+Math.sin(b.age*.06)*32;if(b.x<-40||b.x>W+40||b.life<=0){ebullets.splice(i,1);continue}}
    else if(b.type==='laser'){
      if(b.age>=b.telegraph&&player.alive){
        const x2=b.x+Math.cos(b.angle)*b.length,y2=b.y+Math.sin(b.angle)*b.length;
        const d=distPtSeg(player.x+player.w/2,player.y+player.h/2,b.x,b.y,x2,y2);
        if(d<14){hurtPlayer()}
      }
      if(b.life<=0){ebullets.splice(i,1);continue}
      continue;
    }
    if(player.alive&&b.type!=='laser'&&circleHitsRect(b.x,b.y,(b.r||10)-2,player.x+4,player.y+4,player.w-8,player.h-8)){hurtPlayer();ebullets.splice(i,1);continue}

/* ===== PLAYER UPDATE ===== */
function updatePlayer(){
  if(!player.alive){player.vy+=.6;player.y+=player.vy;if(player.y>GROUND-player.h){player.y=GROUND-player.h;player.vy=0}return}
  const accel=.9,maxSpd=4.4;
  if(player.dashTime>0){player.vx=player.dashDir*11;player.dashTime--}
  else if(down('a','arrowleft')){player.vx=Math.max(player.vx-accel,-maxSpd);player.facing=-1}
  else if(down('d','arrowright')){player.vx=Math.min(player.vx+accel,maxSpd);player.facing=1}
  else{player.vx*=.78;if(Math.abs(player.vx)<.1)player.vx=0}
  if((consume('w')||consume(' ')||consume('arrowup'))&&player.onGround){player.vy=-12.5;player.onGround=false;sfx(660,.08,'square',.16,200)}
  if(consume('shift')&&player.dashCd<=0){player.dashTime=14;player.dashCd=36;player.dashDir=player.facing;player.iframes=Math.max(player.iframes,14);sfx(440,.10,'sawtooth',.18,400);emit(player.x+player.w/2,player.y+player.h-4,'#ffce6b',8,4,20,3,.1)}
  if(player.dashCd>0)player.dashCd--;
  if(down('j','z')||mouseShoot)tryShoot();
  if(player.shootCd>0)player.shootCd--;
  if(consume('k')||consume('x'))tryParry();
  if(consume('l'))trySuper();
  player.vy+=.62;player.x+=player.vx;player.y+=player.vy;
  if(player.x<10)player.x=10;
  if(player.x>W-player.w-10)player.x=W-player.w-10;
  if(player.y>=GROUND-player.h){player.y=GROUND-player.h;player.vy=0;if(!player.onGround)emit(player.x+player.w/2,GROUND-4,'#caa57e',4,2,12,2,.1);player.onGround=true}
  else player.onGround=false;
  autoParry();
  if(player.iframes>0)player.iframes--;
  if(player.parryAnim>0)player.parryAnim--;
  if(player.superReadyPulse>0)player.superReadyPulse--;
  if(player.onGround&&Math.abs(player.vx)>.5)player.runFrame=(player.runFrame+1)%16;
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0||p.y>GROUND+20)particles.splice(i,1)}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.9;s.vy*=.9;s.life--;if(s.life<=0)sparks.splice(i,1)}
}

function accAnchor(bt,x,y){

function drawMothership(){
  const x=boss.x,y=boss.y,p=boss.palette,hit=boss.hitFlash>0;
  const main=hit?'#fff':p.p,dark=hit?'#fff':p.s;
  // big glow
  X.fillStyle=p.a+'33';X.beginPath();X.ellipse(x+boss.w/2,y+boss.h/2,boss.w*.9,boss.h*.7,0,0,Math.PI*2);X.fill();
  // body
  X.fillStyle=dark;X.beginPath();X.ellipse(x+boss.w/2,y+boss.h*.55,boss.w*.55,boss.h*.35,0,0,Math.PI*2);X.fill();
  X.fillStyle=main;X.beginPath();X.ellipse(x+boss.w/2,y+boss.h*.5,boss.w*.5,boss.h*.28,0,0,Math.PI*2);X.fill();
  // top dome / core
  if(boss.phase<3){X.fillStyle=p.a;X.beginPath();X.ellipse(x+boss.w/2,y+boss.h*.32,boss.w*.28,boss.h*.22,0,Math.PI,Math.PI*2);X.fill();X.fillStyle=p.a+'aa';X.beginPath();X.arc(x+boss.w/2,y+boss.h*.32,boss.w*.12,0,Math.PI*2);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(x+boss.w/2,y+boss.h*.30,boss.w*.06,0,Math.PI*2);X.fill()}
  // cannons
  for(let i=0;i<5;i++){const cx=x+boss.w*.2+i*boss.w*.15,cy=y+boss.h*.72;X.fillStyle=dark;X.fillRect(cx-6,cy,12,28);X.fillStyle=main;X.fillRect(cx-4,cy+4,8,20);if(boss.state==='barrage'||boss.state==='laser'){X.fillStyle=p.a;X.beginPath();X.arc(cx,cy+30,4+Math.random()*3,0,Math.PI*2);X.fill()}}
  // lights
  for(let i=0;i<9;i++){const blink=(Math.floor(timeT/6)+i)%2===0;X.fillStyle=blink?p.a:'#1a0a30';X.beginPath();X.arc(x+boss.w*.12+i*boss.w*.095,y+boss.h*.55,5,0,Math.PI*2);X.fill()}
  // phase 3: expose core
  if(boss.phase>=3){
    X.save();X.translate(boss.heartX,boss.heartY);
    const s=1+Math.sin(boss.bob*4)*.06;X.scale(s,s);
    X.fillStyle=p.a+'88';X.beginPath();X.arc(0,0,60,0,Math.PI*2);X.fill();
    X.fillStyle=hit?'#fff':p.a;X.beginPath();X.arc(0,0,30,0,Math.PI*2);X.fill();
    X.fillStyle='#fff';X.beginPath();X.arc(-6,-8,8,0,Math.PI*2);X.fill();
    X.fillStyle='#1a0a30';X.beginPath();X.arc(0,0,10,0,Math.PI*2);X.fill();
    X.restore();
  }
}

function drawBoss(){
  if(!boss.alive&&boss.state!=='death')return;
  X.save();
  if(boss.invuln>0&&Math.floor(timeT/3)%2===0)X.globalAlpha=.6;
  const t=boss.bodyType,x=boss.x,y=boss.y,p=boss.palette,hit=boss.hitFlash>0;
  if(boss.isFinal)drawMothership();
  else if(t==='cactus')drawCactus(x,y,p,hit);
  else if(t==='scorpion')drawScorpion(x,y,p,hit);
  else if(t==='vulture')drawVulture(x,y,p,hit);
  else if(t==='wraith')drawWraith(x,y,p,hit);
  else if(t==='golem')drawGolem(x,y,p,hit);
  else if(t==='lantern')drawLantern(x,y,p,hit);
  else if(t==='piano')drawPiano(x,y,p,hit);
  else if(t==='troll')drawTroll(x,y,p,hit);
  else if(t==='condor')drawCondor(x,y,p,hit);
  else if(t==='meteor')drawMeteor(x,y,p,hit);
  else if(t==='ufo')drawUFO(x,y,p,hit);
  // Accessory overlay — gives each boss a unique silhouette feature
  if(boss.config&&boss.config.accessory){
    const a=accAnchor(t,x,y);
    drawAccessory(a.x,a.y,boss.config.accessory,p);
  }
  X.restore();
}

/* ===== PLAYER DRAW ===== */
function drawPlayer(){
  if(!player.alive)return;
  const flick=player.iframes>0&&Math.floor(timeT/3)%2===0;
  if(flick)X.globalAlpha=.5;
  X.save();X.translate(player.x+player.w/2,player.y);X.scale(player.facing,1);
  const ro=(player.onGround&&Math.abs(player.vx)>.5)?Math.sin(player.runFrame*.5)*4:0;

  X.fillStyle='#2a160c';X.fillRect(-10,-4,20,6);X.fillRect(-10,2,4,6);X.fillRect(6,2,4,6);

  X.fillStyle='#e8b48a';X.fillRect(8,14,6,5);

  X.fillStyle='#c8323a';X.beginPath();X.moveTo(18,9);X.lineTo(30,14);X.lineTo(18,19);X.closePath();X.fill();

  }

      X.fillStyle='#ff6fb344';X.beginPath();X.arc(b.x,b.y,b.r+9,0,Math.PI*2);X.fill();
      X.fillStyle='#ff6fb3aa';X.beginPath();X.arc(b.x,b.y,b.r+3,0,Math.PI*2);X.fill();
      X.fillStyle='#ff6fb3';X.beginPath();X.arc(b.x,b.y,b.r,0,Math.PI*2);X.fill();
      X.fillStyle='#ffd7e8';X.beginPath();X.arc(b.x-3,b.y-3,4,0,Math.PI*2);X.fill();
      for(let k=0;k<4;k++){const ang=b.age*.1+k*Math.PI/2,rr=b.r+11;X.fillStyle='#fff';X.fillRect(b.x+Math.cos(ang)*rr-1,b.y+Math.sin(ang)*rr-1,2,2)}
    }
    else if(b.type==='laser'){
      const x2=b.x+Math.cos(b.angle)*b.length,y2=b.y+Math.sin(b.angle)*b.length;
      if(b.age<b.telegraph){X.strokeStyle='rgba(255,80,80,'+(.3+Math.sin(timeT*.5)*.2)+')';X.lineWidth=4;X.beginPath();X.moveTo(b.x,b.y);X.lineTo(x2,y2);X.stroke()}
      else{X.strokeStyle='#fff';X.lineWidth=16;X.beginPath();X.moveTo(b.x,b.y);X.lineTo(x2,y2);X.stroke();X.strokeStyle='#ff6fb3';X.lineWidth=8;X.beginPath();X.moveTo(b.x,b.y);X.lineTo(x2,y2);X.stroke()}
    }
  }
}
function drawParticles(){
  for(const p of particles){const a=clamp(p.life/p.maxLife,0,1);X.globalAlpha=a;X.fillStyle=p.c;X.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r)}
  X.globalAlpha=1;
  for(const s of sparks){X.strokeStyle=s.c;X.lineWidth=2;X.beginPath();X.moveTo(s.x,s.y);X.lineTo(s.x-s.vx*.4,s.y-s.vy*.4);X.stroke()}
}

/* ===== HUD ===== */
function drawHeart(cx,cy,r){X.beginPath();X.moveTo(cx,cy+r*.7);X.bezierCurveTo(cx-r*1.4,cy-r*.4,cx-r*.4,cy-r*1.2,cx,cy-r*.2);X.bezierCurveTo(cx+r*.4,cy-r*1.2,cx+r*1.4,cy-r*.4,cx,cy+r*.7);X.fill()}

/* MAP layout: 6 rows (biomes), each row holds its bosses zigzagging. */
function mapNodePos(id){
  const cfg=CFGS.find(c=>c.id===id);if(!cfg)return null;
  if(cfg.isFinal)return{x:W/2,y:70,biome:5,final:true};
  let idx=0;for(const c of CFGS){if(c.biome===cfg.biome&&!c.isFinal){if(c.id===cfg.id)break;idx++}}
  const biomeCount=(cfg.biome===5)?9:8;
  const rowY=[460,390,320,250,180,110][cfg.biome];
  const lr=(cfg.biome%2===0)?idx:(biomeCount-1-idx);
  const x=70+lr*((W-140)/(biomeCount-1));
  return{x,y:rowY,biome:cfg.biome,final:false};
}
function drawMap(){
  // gradient background blending all biomes
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#050010');g.addColorStop(.18,'#1a1830');g.addColorStop(.36,'#506080');g.addColorStop(.54,'#4a3a5a');g.addColorStop(.72,'#1a1008');g.addColorStop(.88,'#7a2a3c');g.addColorStop(1,'#e07a3e');
  X.fillStyle=g;X.fillRect(0,0,W,H);
  // stars at top
  for(let i=0;i<50;i++){const x=(i*51+timeT*.2)%W,y=(i*37)%120;X.fillStyle='#fff';X.fillRect(x,y,2,2)}
  // header
  X.fillStyle='#ffce6b';X.font='bold 22px ui-sans-serif,system-ui';X.textAlign='center';
  X.fillText('MAPA DE BANDOLEROS  —  '+progress.defeated.length+' / 50',W/2,30);
  X.textAlign='left';
  // biome labels on left
  for(let i=0;i<6;i++){
    const y=[460,390,320,250,180,110][i];
    X.fillStyle='#ffce6b88';X.font='bold 11px ui-monospace,monospace';X.fillText(BIOMES[i].name,12,y-22);
    X.fillStyle='#caa57e66';X.font='10px ui-sans-serif,system-ui';X.fillText(BIOMES[i].sub,12,y-10);
  }
  // connections
  for(let id=1;id<=FINAL_ID-1;id++){
    const a=mapNodePos(id),b=mapNodePos(id+1);if(!a||!b)continue;
    const aDef=progress.defeated.includes(id);
    const bUnlocked=progress.current>=id+1||progress.defeated.includes(id+1);
    const open=aDef&&bUnlocked;
    if(open){X.strokeStyle='#ffce6b';X.setLineDash([])}
    else{X.strokeStyle='#3a2618';X.setLineDash([6,4])}
    X.lineWidth=3;X.beginPath();X.moveTo(a.x,a.y);
    // arc slightly
    const midX=(a.x+b.x)/2,midY=(a.y+b.y)/2-15;
    X.quadraticCurveTo(midX,midY,b.x,b.y);X.stroke();X.setLineDash([]);
    // ladder rungs visual on vertical transitions
    if(Math.abs(a.y-b.y)>40){
      const steps=5;X.strokeStyle=open?'#ffce6b':'#3a2618';X.lineWidth=2;
      for(let s=1;s<steps;s++){const t=s/steps,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;X.beginPath();X.moveTo(x-6,y);X.lineTo(x+6,y);X.stroke()}
    }
    // chain icon for locked
    if(!open){X.fillStyle='#caa57e';X.beginPath();X.arc(midX,midY,7,0,Math.PI*2);X.fill();X.fillStyle='#1a0a08';X.fillRect(midX-3,midY-2,6,4)}
  }
  // nodes
  for(let id=1;id<=FINAL_ID;id++){
    const pos=mapNodePos(id);if(!pos)continue;
    const cfg=CFGS.find(c=>c.id===id);
    const def=progress.defeated.includes(id);
    const isCurrent=progress.current===id&&!def;
    const locked=progress.current<id;
    const r=pos.final?28:18;
    if(locked){
      X.fillStyle='#1a0a14';X.beginPath();X.arc(pos.x,pos.y,r,0,Math.PI*2);X.fill();
      X.strokeStyle='#3a2618';X.lineWidth=2;X.beginPath();X.arc(pos.x,pos.y,r,0,Math.PI*2);X.stroke();
      X.fillStyle='#caa57e';X.font='bold 14px ui-sans-serif,system-ui';X.textAlign='center';X.fillText('?',pos.x,pos.y+5);X.textAlign='left';
    } else if(def){
      X.fillStyle='#2a3a20';X.beginPath();X.arc(pos.x,pos.y,r,0,Math.PI*2);X.fill();
      X.strokeStyle='#7ed957';X.lineWidth=2;X.beginPath();X.arc(pos.x,pos.y,r,0,Math.PI*2);X.stroke();
      X.strokeStyle='#7ed957';X.lineWidth=3;X.beginPath();X.moveTo(pos.x-7,pos.y);X.lineTo(pos.x-2,pos.y+5);X.lineTo(pos.x+7,pos.y-6);X.stroke();
    } else if(isCurrent){
      const pulse=1+Math.sin(timeT*.15)*.15;
      X.fillStyle=pos.final?'#a050d0':cfg.palette.p;
      X.beginPath();X.arc(pos.x,pos.y,r*pulse,0,Math.PI*2);X.fill();
      X.strokeStyle=pos.final?'#ff6fb3':'#ffce6b';X.lineWidth=3;X.beginPath();X.arc(pos.x,pos.y,r*pulse,0,Math.PI*2);X.stroke();
      X.fillStyle='#fff';X.font='bold 14px ui-sans-serif,system-ui';X.textAlign='center';X.fillText(pos.final?'★':String(id),pos.x,pos.y+5);X.textAlign='left';
      // name label
      X.fillStyle='#ffce6b';X.font='bold 13px ui-sans-serif,system-ui';X.textAlign='center';
      X.fillText(cfg.name,pos.x,pos.y+r+18);X.fillStyle='#caa57e';X.font='11px ui-sans-serif,system-ui';X.fillText('— ENTER para pelear —',pos.x,pos.y+r+34);X.textAlign='left';
    }
    if(pos.final&&!def){X.fillStyle='#ff6fb3';X.font='bold 11px ui-sans-serif,system-ui';X.textAlign='center';X.fillText('JEFE FINAL',pos.x,pos.y-r-8);X.textAlign='left'}
  }
}

/* ===== SCENE RENDER ===== */
function renderScene(){
  let ox=0,oy=0;
  if(shakeT>0){ox=(Math.random()*2-1)*shakeMag;oy=(Math.random()*2-1)*shakeMag;shakeT--;if(shakeT<=0)shakeMag=0}
  X.save();X.translate(ox,oy);
  const bg=BIOME_BG[boss.biome||0];bg();
  drawBoss();drawParticles();drawBullets();drawPlayer();
  X.restore();
  if(flash>0){X.fillStyle='rgba(255,255,255,'+(flash/30)+')';X.fillRect(0,0,W,H);flash--}
  drawHUD();
}

/* ===== STATE TRANSITIONS ===== */
function onBossDefeated(){
  const id=boss.config.id;
  if(!progress.defeated.includes(id))progress.defeated.push(id);
  progress.current=Math.max(progress.current,id+1);
  saveProgress();
  if(boss.isFinal)state='final_win';else state='win';
  cinematicT=120;
}

/* ===== LOOP ===== */
function loop(){
  timeT++;titlePulse++;
  pollGamepad();
  if(state==='title'){
    drawTitle();
    drawGamepadToast();
    if(consume('enter')){state='map'}
    if(consume('r')){resetProgress()}
    requestAnimationFrame(loop);return;
  }
  if(state==='map'){
    drawMap();
    drawGamepadToast();
    if(consume('enter')){
      const id=Math.min(progress.current,FINAL_ID);
      startFight(id);
    }
    if(consume('escape'))state='title';
    if(consume('r'))resetProgress();
    requestAnimationFrame(loop);return;
  }
  if(state==='win'||state==='lose'||state==='final_win'){
    if(slowmo>0)slowmo--;
    updateParticles();renderScene();
    if(state==='win')drawWin();
    else if(state==='lose')drawLose();
    else drawFinalWin();
    drawGamepadToast();
    if(consume('enter')){state=(state==='final_win')?'title':'map'}
    requestAnimationFrame(loop);return;
  }
  // fight
  if(slowmo>0)slowmo--;
  updatePlayer();updateBoss();updateBullets();updateParticles();
  renderScene();
  drawGamepadToast();
  if(consume('escape'))state='map';
  requestAnimationFrame(loop);
}

/* ===== GAMEPAD (PS5 DualSense / standard) =====
   Cruz=saltar  Cuadrado=disparar  Círculo=parry  Triángulo=super
   L2=dash  R1=parry  R2=disparar  Options=enter  Stick L / D-pad=mover  */
const GP_MAP={0:' ',1:'k',2:'j',3:'l',4:'l',5:'k',6:'shift',7:'j',9:'enter',12:' ',14:'a',15:'d'};
let gpHeld={};
let gpToast=0,gpId='';
addEventListener('gamepadconnected',e=>{gpId=e.gamepad.id||'Gamepad';gpToast=180});
addEventListener('gamepaddisconnected',()=>{gpId='';gpToast=120;gpHeld={};});
function pollGamepad(){
  const pads=(navigator.getGamepads&&navigator.getGamepads())||[];
  let pad=null;for(const p of pads)if(p&&p.connected){pad=p;break}
  if(!pad){if(Object.keys(gpHeld).length){for(const k in gpHeld)if(gpHeld[k]){K[k]=false;gpHeld[k]=false}}return}
  const now={};
  for(const idxStr in GP_MAP){
    const idx=+idxStr,key=GP_MAP[idxStr],b=pad.buttons[idx];
    if(b&&(b.pressed||b.value>.5))now[key]=true;
  }
  // Left stick X (deadzone .3)
  if(pad.axes[0]<-.3)now.a=true;
  if(pad.axes[0]>.3)now.d=true;
  // Apply: press newly held
  for(const k in now){
    if(!gpHeld[k]){if(!K[k])pressed[k]=true;gpHeld[k]=true}
    K[k]=true;
  }
  // Release what gamepad previously held but no longer
  for(const k in gpHeld){if(gpHeld[k]&&!now[k]){K[k]=false;gpHeld[k]=false}}
  if(Object.keys(now).length)initAudio();
}
function drawGamepadToast(){
  if(gpToast<=0)return;
  gpToast--;
  const a=Math.min(1,gpToast/30);
  X.save();X.globalAlpha=a*.92;
  X.fillStyle='#1a0a14';X.fillRect(W/2-180,H-50,360,32);
  X.strokeStyle='#ffce6b';X.lineWidth=2;X.strokeRect(W/2-180,H-50,360,32);
  X.fillStyle='#ffce6b';X.font='bold 13px ui-sans-serif,system-ui';X.textAlign='center';
  X.fillText(gpId?('🎮 '+gpId.substring(0,40)+' conectado'):'🎮 Gamepad desconectado',W/2,H-30);
  X.textAlign='left';X.restore();
}

/* ===== TOUCH CONTROLS ===== */
(function bindTouch(){
  const tog=document.getElementById('tc-toggle');
  if(tog)tog.addEventListener('click',()=>{
    document.body.classList.toggle('tc-force');
    tog.classList.toggle('on');
  });
  document.querySelectorAll('.tc-btn').forEach(btn=>{
    const key=btn.dataset.k;
    function on(e){e.preventDefault();e.stopPropagation();if(!K[key])pressed[key]=true;K[key]=true;btn.classList.add('on');initAudio()}
    function off(e){if(e){e.preventDefault();e.stopPropagation()}K[key]=false;btn.classList.remove('on')}
    btn.addEventListener('touchstart',on,{passive:false});
    btn.addEventListener('touchend',off,{passive:false});
    btn.addEventListener('touchcancel',off,{passive:false});
    btn.addEventListener('mousedown',on);
    btn.addEventListener('mouseup',off);
    btn.addEventListener('mouseleave',off);
  });
  // Prevent the page from scrolling/zooming when interacting with controls
  document.addEventListener('touchmove',e=>{if(e.target.closest('#touch-controls'))e.preventDefault()},{passive:false});
})();

state='title';
requestAnimationFrame(loop);
</script>
